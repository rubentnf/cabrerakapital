<!-- Versión nocturna de editorial-balanza.svg (modo oscuro) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#132a4b"/>
  <circle cx="300" cy="300" r="240" fill="#1f3d66"/>

  <!-- columna y base -->
  <rect x="289" y="176" width="22" height="290" rx="6" fill="#ece5d4"/>
  <rect x="196" y="458" width="208" height="28" rx="14" fill="#ece5d4"/>

  <!-- brazo, inclinado hacia la mejor oferta -->
  <rect x="134" y="190" width="332" height="14" rx="7" fill="#ece5d4" transform="rotate(6 300 197)"/>
  <circle cx="300" cy="182" r="20" fill="#d8a858" stroke="#ece5d4" stroke-width="6"/>

  <!-- platillo izquierdo: otra oferta -->
  <g>
    <path d="M141 181L89 312M141 181L193 312" stroke="#ece5d4" stroke-width="4" opacity=".6"/>
    <rect x="113" y="250" width="58" height="62" rx="7" fill="#f7f3ea" stroke="#f7f3ea" stroke-width="4" opacity=".9"/>
    <g fill="#0a2240" opacity=".35"><rect x="124" y="264" width="36" height="7" rx="3.5"/><rect x="124" y="279" width="28" height="7" rx="3.5"/><rect x="124" y="294" width="32" height="7" rx="3.5"/></g>
    <path d="M77 312Q141 362 205 312Z" fill="#d8a858" stroke="#ece5d4" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- platillo derecho: la mejor oferta -->
  <g>
    <path d="M459 214L407 346M459 214L511 346" stroke="#ece5d4" stroke-width="4" opacity=".6"/>
    <rect x="426" y="270" width="66" height="76" rx="8" fill="#ece5d4"/>
    <path d="M444 309l10 11l20-23" fill="none" stroke="#a8732a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M395 346Q459 396 523 346Z" fill="#d8a858" stroke="#ece5d4" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
